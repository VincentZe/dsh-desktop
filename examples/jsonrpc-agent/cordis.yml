# Unattended coding-agent deployment for the bundled dsh-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# Load the same user-owned model and credential documents as the product dsh
# profiles. Environment variables remain scrubbed by the runner; these plugins
# resolve the configured provider route and its credential from the dsh home.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# The DeepSeek adapter. Shipped default: full thinking at max effort on every
# request; exact-model resolution materializes request defaults before logging.
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# The runner supplies DSH_PERMISSION_MODE and DSH_APPROVAL_POLICY for each
# child. The defaults match the runner: writes stay inside the session cwd and
# a wider sandbox retry requires an approval answerer. This JSON-RPC runtime
# has no human approval UI, so an unanswered escalation fails closed.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

# Managed child-process groups for the platform-native confined executor
# (spawn/kill/output plumbing). The Windows ACL runner supports PowerShell's
# process model; MSYS2 Git Bash creates signal pipes with the user SID, which a
# write-restricted token cannot authorize without weakening workspace-write.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js process.env.DSH_APPROVAL_POLICY ?? 'ask'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent. Your working directory is {{cwd}}.'
    workspaceContext: false
    skills:
      enabled: false
    # The platform-gated shell tool rows below own the model-facing shell
    # name; mounting the agent-spine bash consumer here would duplicate it.
    toolBash: false
    toolJobs: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
